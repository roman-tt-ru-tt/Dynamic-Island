<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Red Button</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: blue;
    }

    .red-button {
      background-color: red;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .red-button:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>
  <button class="red-button">Click Me</button>
</body>
</html>
